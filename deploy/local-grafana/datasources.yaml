apiVersion: 1
datasources:
  # These point at the kubectl port-forwards started by scripts/gke-portforward.sh.
  # host.docker.internal resolves to the host from inside the Grafana container.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://host.docker.internal:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://host.docker.internal:3100

# Read-only access for the collector's Kubernetes state-metrics source.
# The collector lists pods, deployments, and nodes across ALL namespaces
# (KUBERNETES_NAMESPACE=""), so pods/deployments use a ClusterRole too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-collector
  namespace: telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: telemetry-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: telemetry-collector
subjects:
  - kind: ServiceAccount
    name: telemetry-collector
    namespace: telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: telemetry-collector
